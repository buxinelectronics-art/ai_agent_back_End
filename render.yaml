services:
  - type: web
    name: jobagent-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn.conf.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: GENERATED_FOLDER
        value: /var/data/generated
      - key: ALLOWED_ORIGINS
        value: https://abdoukadir-ai.github.io,http://localhost:3000
      - key: FLASK_DEBUG
        value: "false"
    disk:
      name: jobagent-data
      mountPath: /var/data
      sizeGB: 10
